<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="s5bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#eef1f6"/>
      <stop offset="60%" stop-color="#e0e5ec"/>
      <stop offset="100%" stop-color="#cdd4e0"/>
    </radialGradient>
    <radialGradient id="s5glow" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#c47d56" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#c47d56" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s5panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf3"/>
      <stop offset="100%" stop-color="#d5dbe6"/>
    </linearGradient>
    <linearGradient id="s5accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d69b72"/><stop offset="100%" stop-color="#c47d56"/>
    </linearGradient>
    <filter id="s5dark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="s5in" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#s5bg)"/>
  <ellipse cx="800" cy="430" rx="520" ry="400" fill="url(#s5glow)"/>

  <!-- raised console panel (neumorphic: dark shadow lower-right, light upper-left) -->
  <g>
    <rect x="512" y="262" width="576" height="356" rx="34" fill="#b9c1d0" filter="url(#s5dark)" opacity="0.75" transform="translate(20 22)"/>
    <rect x="512" y="262" width="576" height="356" rx="34" fill="#ffffff" filter="url(#s5dark)" opacity="0.7" transform="translate(-20 -22)"/>
    <rect x="512" y="262" width="576" height="356" rx="34" fill="url(#s5panel)"/>

    <!-- recessed readout window -->
    <rect x="566" y="322" width="468" height="236" rx="24" fill="#dce1ea"/>
    <rect x="566" y="322" width="468" height="30" rx="24" fill="#c4ccd9" opacity="0.7" filter="url(#s5in)"/>
    <text x="800" y="470" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="150" font-weight="700" letter-spacing="-2" fill="#3d4763">20:00</text>

    <!-- accent progress groove -->
    <rect x="566" y="588" width="468" height="12" rx="6" fill="#c8cfdb"/>
    <rect x="566" y="588" width="150" height="12" rx="6" fill="url(#s5accent)"/>
  </g>

  <!-- primary control pill -->
  <g transform="translate(690 680)">
    <rect x="0" y="0" width="220" height="66" rx="20" fill="url(#s5accent)"/>
    <text x="110" y="42" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="20" font-weight="500" letter-spacing="3" fill="#ffffff">START</text>
  </g>

  <!-- soft floating dust -->
  <g fill="#c47d56" opacity="0.35">
    <circle cx="300" cy="220" r="4"/><circle cx="1300" cy="260" r="3"/><circle cx="1180" cy="150" r="3"/>
    <circle cx="380" cy="640" r="3"/><circle cx="1240" cy="620" r="4"/>
  </g>
</svg>
