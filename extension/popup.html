<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EYE CARE</title>
  <style>
    :root {
      --bg: #f5f1ea;
      --ink: #1c1b18;
      --mute: #7a7568;
      --primary: #c47d56;
      --rule: rgba(28,27,24,.14);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e141a; --ink: #ece5d3; --mute: #8a8378; --rule: rgba(236,229,211,.14); }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      padding: 24px 20px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .eyebrow {
      font-family: ui-monospace, SF Mono, Menlo, monospace;
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--mute); margin-bottom: 12px;
    }
    .time {
      font-family: ui-serif, Charter, "Iowan Old Style", Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 64px; line-height: 1; letter-spacing: -2px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .state {
      font-family: ui-serif, Georgia, serif; font-style: italic;
      font-size: 14px; color: var(--mute); margin-top: 8px;
    }
    .actions { margin-top: 20px; display: flex; gap: 8px; }
    button {
      flex: 1; padding: 10px 12px;
      font-family: ui-monospace, monospace;
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      background: transparent; border: 1px solid var(--ink); color: var(--ink);
      cursor: pointer;
    }
    button.primary { background: var(--ink); color: var(--bg); }
    a.link {
      display: block; margin-top: 18px; text-align: center;
      font-family: ui-serif, Georgia, serif; font-style: italic;
      font-size: 12px; color: var(--mute); text-decoration: none;
      border-top: 1px solid var(--rule); padding-top: 14px;
    }
  </style>
</head>
<body>
  <div class="eyebrow">EYE CARE · 20-20-20 rule</div>
  <div id="time" class="time">20:00</div>
  <div id="state" class="state">a quiet timer for your eyes</div>
  <div class="actions">
    <button id="start" class="primary">Start</button>
    <button id="stop">Stop</button>
  </div>
  <a class="link" href="https://eyecare.love" target="_blank" rel="noopener">eyecare.love →</a>
  <script src="popup.js"></script>
</body>
</html>
